<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTL architecture proposals</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 28px; background: #0b1016; color: #eef5fa; font-family: Intel Clear, Segoe UI, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 28px; letter-spacing: 0; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; padding: 12px; background: #151d26; border: 1px solid #405064; border-radius: 6px; }
    img { display: block; width: 100%; height: auto; background: #fff; }
    figcaption { padding: 10px 2px 1px; font-size: 16px; font-weight: 700; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Media Transport Library architecture: 10 propositions</h1>
  <main>
    <figure><img src="arch-option-01-precision-grid.svg" alt="Option 01: Precision Grid"><figcaption>01. Precision Grid</figcaption></figure>
<figure><img src="arch-option-02-broadcast-console.svg" alt="Option 02: Broadcast Console"><figcaption>02. Broadcast Console</figcaption></figure>
<figure><img src="arch-option-03-arctic-documentation.svg" alt="Option 03: Arctic Documentation"><figcaption>03. Arctic Documentation</figcaption></figure>
<figure><img src="arch-option-04-layered-workbench.svg" alt="Option 04: Layered Workbench"><figcaption>04. Layered Workbench</figcaption></figure>
<figure><img src="arch-option-05-midnight-mint.svg" alt="Option 05: Midnight Mint"><figcaption>05. Midnight Mint</figcaption></figure>
<figure><img src="arch-option-06-high-contrast-paper.svg" alt="Option 06: High Contrast Paper"><figcaption>06. High Contrast Paper</figcaption></figure>
<figure><img src="arch-option-07-slate-coral.svg" alt="Option 07: Slate + Coral"><figcaption>07. Slate + Coral</figcaption></figure>
<figure><img src="arch-option-08-cobalt-steel.svg" alt="Option 08: Cobalt Steel"><figcaption>08. Cobalt Steel</figcaption></figure>
<figure><img src="arch-option-09-signal-map.svg" alt="Option 09: Signal Map"><figcaption>09. Signal Map</figcaption></figure>
<figure><img src="arch-option-10-executive-system.svg" alt="Option 10: Executive System"><figcaption>10. Executive System</figcaption></figure>
  </main>
</body>
</html>
