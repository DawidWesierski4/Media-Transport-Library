<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MTL architecture proposals</title>
  <style>
    body { margin: 0; padding: 24px; background: #20242b; color: #e8edf3; font-family: sans-serif; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 24px; }
    figure { margin: 0; padding: 10px; background: #2b3038; border-radius: 10px; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; }
    figcaption { padding: 8px 2px 0; font-weight: 700; text-transform: capitalize; }
  </style>
</head>
<body>
  <main>
    <figure><img src="arch-01-neon-glass-refined.svg" loading="lazy"><figcaption>01 neon glass refined</figcaption></figure>
    <figure><img src="arch-02-neon-cyber-eyebrow.svg" loading="lazy"><figcaption>02 neon cyber eyebrow</figcaption></figure>
    <figure><img src="arch-03-aurora-frost.svg" loading="lazy"><figcaption>03 aurora frost</figcaption></figure>
    <figure><img src="arch-04-midnight-flat-accent.svg" loading="lazy"><figcaption>04 midnight flat accent</figcaption></figure>
    <figure><img src="arch-05-github-dark.svg" loading="lazy"><figcaption>05 github dark</figcaption></figure>
    <figure><img src="arch-06-intel-blue-glow.svg" loading="lazy"><figcaption>06 intel blue glow</figcaption></figure>
    <figure><img src="arch-07-blueprint-mono.svg" loading="lazy"><figcaption>07 blueprint mono</figcaption></figure>
    <figure><img src="arch-08-synthwave.svg" loading="lazy"><figcaption>08 synthwave</figcaption></figure>
    <figure><img src="arch-09-emerald-terminal.svg" loading="lazy"><figcaption>09 emerald terminal</figcaption></figure>
    <figure><img src="arch-10-graphite-focus.svg" loading="lazy"><figcaption>10 graphite focus</figcaption></figure>
    <figure><img src="arch-11-high-contrast.svg" loading="lazy"><figcaption>11 high contrast</figcaption></figure>
    <figure><img src="arch-12-light-frost.svg" loading="lazy"><figcaption>12 light frost</figcaption></figure>
    <figure><img src="arch-13-light-intel-clean.svg" loading="lazy"><figcaption>13 light intel clean</figcaption></figure>
    <figure><img src="arch-14-copper-night.svg" loading="lazy"><figcaption>14 copper night</figcaption></figure>
  </main>
</body>
</html>
