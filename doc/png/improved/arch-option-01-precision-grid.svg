<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1292" viewBox="0 0 1600 1292" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps exchange frames, RTP packets and datagrams with the Media Transport Library. The library holds the pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management and the device abstraction layer. It runs on the DPDK PMD or Linux kernel network backends, on Intel NIC and DMA hardware.</desc>
