<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1038" viewBox="0 0 1280 1038" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Layered architecture of the Media Transport Library: applications, the library (Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management, device abstraction layer), the network backend (DPDK PMD, Linux kernel with AF_XDP, Windows kernel not supported), platforms, and NIC and DMA hardware.</desc>
