<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1162" viewBox="0 0 1280 1162" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Applications connect to the Media Transport Library through frames, RTP passthrough and datagrams. The library holds the Pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management and the device abstraction layer. It runs on the DPDK PMD or Linux kernel network backends, on Linux and Windows, with Intel NIC and DMA hardware.</desc>
