<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1246" viewBox="0 0 1600 1246" role="img" aria-labelledby="t d" font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Applications connect to the Media Transport Library through frames, RTP passthrough, and datagrams. The library holds the Pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management, and the device abstraction layer. Below it are the network backends (DPDK PMD, the Linux kernel path with AF_XDP, and the unsupported Windows kernel path), the deployment targets, and the NIC and DMA hardware.</desc>
