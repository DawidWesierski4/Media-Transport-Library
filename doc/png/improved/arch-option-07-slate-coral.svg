<title id="t">Media Transport Library architecture</title>
<desc id="d">Layered architecture: applications use Frames, RTP Passthrough and Datagram interfaces of the Media Transport Library (Pipeline API, ST 2110 sessions, Color Format Conversion, Control Plane Protocols, Management, Device Abstraction Layer). The library uses the DPDK PMD or Linux kernel network backends on NIC hardware and DMA hardware.</desc>
