<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1306" viewBox="0 0 1600 1306" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Layered architecture of the Media Transport Library: applications connect through frames, RTP passthrough and datagram interfaces to the library, which holds the Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer. Below are the network backends (DPDK PMD, Linux kernel with AF_XDP, Windows kernel not supported) and the NIC and DMA hardware.</desc>
