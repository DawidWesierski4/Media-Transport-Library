<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="936" viewBox="0 0 1280 936" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through Frames, RTP Passthrough and Datagram interfaces. MTL holds the Pipeline API, ST 2110 sessions, Color Format Conversion, Control Plane Protocols, Management and the Device Abstraction Layer. The Network Backend is DPDK PMD or the Linux kernel with AF_XDP. NIC and DMA hardware are at the bottom.</desc>
