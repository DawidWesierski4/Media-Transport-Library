<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1016" viewBox="0 0 1200 1016" role="img" aria-labelledby="title desc">
<title id="title">Media Transport Library architecture</title>
<desc id="desc">Apps connect to the Media Transport Library through frames, RTP passthrough and datagrams. The library holds the pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management and the device abstraction layer. It runs on the DPDK PMD or the Linux kernel AF_XDP backend, on Intel NICs and DMA engines.</desc>
