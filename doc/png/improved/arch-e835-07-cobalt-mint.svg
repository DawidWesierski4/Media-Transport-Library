<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="978" viewBox="0 0 1320 978" role="img" aria-labelledby="t d" font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through frames, RTP passthrough and datagrams. The library holds the Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer. It runs on the DPDK PMD or on the Linux kernel through AF_XDP, on Intel NIC and DMA hardware.</desc>
