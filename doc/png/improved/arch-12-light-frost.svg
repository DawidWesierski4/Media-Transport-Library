<title id="t">Media Transport Library architecture</title>
<desc id="d">Layers from top to bottom: applications; the Media Transport Library (Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management, device abstraction layer); network backend (DPDK PMD, Linux kernel with AF_XDP and eBPF, Windows kernel not supported); platforms; NIC and DMA hardware.</desc>
