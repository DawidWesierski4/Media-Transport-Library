<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1372" viewBox="0 0 1600 1372" role="img" aria-labelledby="title desc">
<title id="title">Media Transport Library architecture</title>
<desc id="desc">Layered architecture: applications use the Media Transport Library through frames, RTP passthrough or datagrams. The library has the pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management and a device abstraction layer. It runs on the DPDK PMD or Linux kernel network backends over Intel NIC and DMA hardware.</desc>
