<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1002" viewBox="0 0 1200 1002" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through frames, RTP passthrough and datagrams. The library holds the Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer. It runs on DPDK PMD or the Linux kernel (kernel network stack, AF_XDP with an eBPF program) over NIC and DMA hardware.</desc>
