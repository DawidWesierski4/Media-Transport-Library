<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="t d" font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through Frames, RTP Passthrough and Datagram interfaces. The library holds the Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer. It runs on a network backend (DPDK PMD, or the Linux kernel through AF_XDP) over Intel NIC and DMA hardware.</desc>
