<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1266" viewBox="0 0 1600 1266" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through Frames, RTP Passthrough and Datagram interfaces. The library holds the Pipeline API, Color Format Conversion, ST 2110 sessions, Control Plane Protocols, Management and the Device Abstraction Layer. It runs on a DPDK PMD or Linux kernel (AF_XDP) network backend, over Intel NIC and DMA hardware.</desc>
