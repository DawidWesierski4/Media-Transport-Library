<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="t d" font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through frames, RTP passthrough and datagrams. The library holds the Pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer. It runs on the DPDK PMD or Linux kernel network backends, on Intel NIC and DMA hardware.</desc>
