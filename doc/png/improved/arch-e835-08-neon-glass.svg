<title id="t">Media Transport Library architecture</title>
<desc id="d">Layers from top to bottom: applications; the Media Transport Library with pipeline API, ST 2110 sessions, color format conversion, control plane protocols, management and the device abstraction layer; network backends DPDK PMD and the Linux kernel with AF_XDP; NIC and DMA hardware.</desc>
