<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1302" viewBox="0 0 1400 1302" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Layered architecture of the Media Transport Library: apps connect through frames, RTP passthrough and datagram interfaces to the library (Pipeline API, color format conversion, ST 2110 sessions, control plane protocols, management and the device abstraction layer). The library uses a DPDK PMD or a Linux kernel network backend over Intel NIC and DMA hardware.</desc>
